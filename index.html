<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valorant 特工介绍</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: #0d1117;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #0d1117 0%, #1a0a2e 50%, #0d1117 100%);
      border-bottom: 2px solid #ff4655;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
   .hero::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%; transform: translateX(-50%);
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,70,85,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ff4655;
      border: 1px solid #ff4655;
      padding: 3px 12px;
      margin-bottom: 14px;
    }
    .hero h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 700;
      color: #fff;
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }
    .hero h1 span { color: #ff4655; }
    .hero p {
      color: rgba(255,255,255,0.45);
      font-size: 14px;
      margin-bottom: 1.8rem;
    }

    /* FILTER */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 7px 18px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #ff4655; color: #ff4655; }
    .filter-btn.active { background: #ff4655; border-color: #ff4655; color: #fff; }

    /* COUNT BAR */
    .count-bar {
      text-align: center;
      padding: 0.75rem;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .count-bar span { color: #ff4655; font-weight: 600; }

    /* GRID */
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      padding: 1.5rem;
      max-width: 960px;
      margin: 0 auto;
    }

    /* CARD */
    .agent-card {
      background: #12181f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .agent-card:hover { transform: translateY(-4px); border-color: #ff4655; }

    .agent-banner {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      position: relative;
    }
    .banner-duelist   { background: linear-gradient(135deg, #2a0a0e, #1a0508); }
    .banner-controller{ background: linear-gradient(135deg, #0a102a, #05081a); }
    .banner-initiator { background: linear-gradient(135deg, #2a1e08, #1a1205); }
    .banner-sentinel  { background: linear-gradient(135deg, #082a1a, #051a10); }

    .role-tag {
      position: absolute;
      top: 8px; right: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 2px;
    }
    .role-duelist   { background: rgba(255,70,85,0.18);  color: #ff4655; }
    .role-controller{ background: rgba(100,150,255,0.18); color: #6496ff; }
    .role-initiator { background: rgba(255,180,50,0.18);  color: #ffb432; }
    .role-sentinel  { background: rgba(50,220,130,0.18);  color: #32dc82; }

    .agent-info { padding: 10px 13px 14px; }
    .agent-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 2px;
    }
    .agent-origin { font-size: 12px; color: rgba(255,255,255,0.38); margin-bottom: 8px; }
    .agent-desc   { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.55; }

    /* DETAIL OVERLAY */
    .detail-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .detail-panel.open { display: flex; }

    .detail-box {
      background: #0d1117;
      border: 1px solid #ff4655;
      border-radius: 4px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #ff4655 #1a1a2e;
    }

    .detail-header {
      padding: 1.4rem 1.4rem 1rem;
      border-bottom: 1px solid rgba(255,70,85,0.25);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .detail-emoji { font-size: 46px; display: block; margin-bottom: 8px; }
    .detail-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }
    .detail-meta { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 3px; }

    .close-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.5);
      font-size: 18px;
      width: 34px; height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: monospace;
      transition: all 0.2s;
    }
    .close-btn:hover { border-color: #ff4655; color: #ff4655; }

    .detail-body { padding: 1.4rem; }
    .detail-lore {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      line-height: 1.75;
      margin-bottom: 1.2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .abilities-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #ff4655;
      margin-bottom: 12px;
    }
    .ability {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .ability-key {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,70,85,0.12);
      border: 1px solid rgba(255,70,85,0.35);
      color: #ff4655;
      padding: 3px 7px;
      flex-shrink: 0;
      min-width: 30px;
      text-align: center;
    }
    .ability-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: block;
      margin-bottom: 3px;
    }
    .ability-desc { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.55; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 1rem;
    }
    footer span { color: #ff4655; }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">PROTOCOL // AGENT DATABASE</div>
  <h1>VALO<span>RANT</span> AGENTS</h1>
  <p>29位特工 · 4种职业 · 选择你的战术风格</p>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filter(this,'all')">全部</button>
    <button class="filter-btn" onclick="filter(this,'duelist')">决斗者</button>
    <button class="filter-btn" onclick="filter(this,'controller')">控制者</button>
    <button class="filter-btn" onclick="filter(this,'initiator')">前锋</button>
    <button class="filter-btn" onclick="filter(this,'sentinel')">哨兵</button>
  </div>
</div>

<div class="count-bar">显示 <span id="count">29</span> 位特工</div>
<div class="agents-grid" id="grid"></div>

<footer>
  本站为粉丝制作，非官方内容。所有特工版权归 <span>Riot Games</span> 所有。
</footer>

<!-- DETAIL OVERLAY -->
<div class="detail-panel" id="detail" onclick="closeDetail(event)">
  <div class="detail-box">
    <div class="detail-header">
      <div>
        <span class="detail-emoji" id="d-emoji"></span>
        <div class="detail-name" id="d-name"></div>
        <div class="detail-meta" id="d-meta"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="detail-body">
      <div class="detail-lore" id="d-lore"></div>
      <div class="abilities-title">// 技能列表</div>
      <div id="d-abilities"></div>
    </div>
  </div>
</div>

<script>

    abilities:[

const roleMap = {
  duelist:    {label:'决斗者', cls:'role-duelist',    banner:'banner-duelist'},
  controller: {label:'控制者', cls:'role-controller',  banner:'banner-controller'},
  initiator:  {label:'前锋',   cls:'role-initiator',   banner:'banner-initiator'},
  sentinel:   {label:'哨兵',   cls:'role-sentinel',    banner:'banner-sentinel'}
};

let currentFilter = 'all';

function render() {
  const filtered = currentFilter === 'all' ? agents : agents.filter(a => a.role === currentFilter);
  document.getElementById('count').textContent = filtered.length;
  document.getElementById('grid').innerHTML = filtered.map(a => {
    const r = roleMap[a.role];
    const idx = agents.indexOf(a);
    return `<div class="agent-card" onclick="openDetail(${idx})">
      <div class="agent-banner ${r.banner}">
        <span>${a.emoji}</span>
        <span class="role-tag ${r.cls}">${r.label}</span>
      </div>
      <div class="agent-info">
        <div class="agent-name">${a.name}</div>
        <div class="agent-origin">${a.origin}</div>
        <div class="agent-desc">${a.desc}</div>
      </div>
    </div>`;
  }).join('');
}

function filter(btn, role) {
  currentFilter = role;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function openDetail(idx) {
  const a = agents[idx];
  const r = roleMap[a.role];
  document.getElementById('d-emoji').textContent = a.emoji;
  document.getElementById('d-name').textContent = a.name;
  document.getElementById('d-meta').textContent = r.label + ' · ' + a.origin;
  document.getElementById('d-lore').textContent = a.lore;
  document.getElementById('d-abilities').innerHTML = a.abilities.map(ab =>
    `<div class="ability">
      <span class="ability-key">${ab.key}</span>
      <div>
        <span class="ability-name">${ab.name}</span>
        <span class="ability-desc">${ab.desc}</span>
      </div>
    </div>`
  ).join('');
  document.getElementById('detail').classList.add('open');
}

function closePanel() {
  document.getElementById('detail').classList.remove('open');
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail')) closePanel();
}

render();
</script>
